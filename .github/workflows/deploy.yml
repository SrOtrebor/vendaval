name: Deploy Theme to DonWeb FTP

on:
  push:
    branches:
      - main
    paths:
      - 'vendaval-theme/**'

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Sync files
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local_path: './vendaval-theme/*'
        remote_path: '/public_html/wp-content/themes/vendaval-theme/'
        sftp_only: true
